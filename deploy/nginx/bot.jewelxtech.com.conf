# Host-level nginx reverse proxy for bot.jewelxtech.com.
#
# This file does NOT manage TLS certificates. Install with certbot's nginx
# plugin (`certbot --nginx -d bot.jewelxtech.com`), which will rewrite the
# `listen 443` block below in place and set up auto-renewal. See
# docs/DEPLOYMENT.md for the full setup procedure. Never commit real certs.
#
# Install:
#   sudo cp deploy/nginx/bot.jewelxtech.com.conf /etc/nginx/sites-available/bot.jewelxtech.com.conf
#   sudo ln -s /etc/nginx/sites-available/bot.jewelxtech.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# HTTP: ACME challenge + redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bot.jewelxtech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: reverse proxy to the app container
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bot.jewelxtech.com;

    # Populated by certbot; placeholders only.
    ssl_certificate     /etc/letsencrypt/live/bot.jewelxtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.jewelxtech.com/privkey.pem;

    # 25MB: headroom above the app's own 20MB upload cap
    # (src/app/api/kb/upload/route.ts MAX_BYTES) to account for multipart
    # encoding overhead.
    client_max_body_size 25m;

    # 130s: headroom above the app's longest route-level timeout
    # (maxDuration = 120 on KB ingestion and the broadcast worker route).
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
