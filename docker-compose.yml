services:
  app:
    # `image:` lets production pull a prebuilt tag from GHCR (set IMAGE_TAG to
    # a git SHA to pin/rollback); `build:` is used automatically instead when
    # no matching image is found locally, e.g. for local development.
    image: ghcr.io/jewelx-ai/whatsapp-bot-ai:${IMAGE_TAG:-main}
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    # Bound to localhost only — host-level nginx (see deploy/nginx/) is the
    # only intended public entry point. Change to "3000:3000" only for local
    # development access from outside the host.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
